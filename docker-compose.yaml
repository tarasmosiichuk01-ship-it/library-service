services:
  library:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    volumes:
      - my_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5


  celery:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/app
    command: >
      sh -c "celery -A library_service worker -l info"
    depends_on:
      redis:
        condition: service_started
      library:
        condition: service_started


  celery-beat:
    restart: on-failure
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/app
    command: >
      sh -c "celery -A library_service beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      redis:
        condition: service_healthy
      library:
        condition: service_started


volumes:
  my_db:
  my_media: